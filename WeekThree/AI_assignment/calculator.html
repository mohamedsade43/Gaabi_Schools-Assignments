
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">

        <header class="calculator-header">
            <div class="brand">
                <div class="brand-icon">M</div>
                <div>
                    <h1>mohamed's</h1>
                    <p>Smart Calculator</p>
                </div>
            </div>

            <span class="status">
                <span class="status-dot"></span>
                READY
            </span>
        </header>

        <section class="display" aria-label="Calculator display">
            <p class="display-label">CURRENT CALCULATION</p>
            <div class="previous-operand" id="previousOperand"></div>
            <output class="current-operand" id="currentOperand"
                    aria-live="polite">0</output>
        </section>

        <section class="keypad" aria-label="Calculator buttons">

            <button class="key utility" data-action="clear">AC</button>
            <button class="key utility" data-action="delete">DEL</button>
            <button class="key operator" data-operator="%">%</button>
            <button class="key operator" data-operator="÷">÷</button>

            <button class="key" data-number="7">7</button>
            <button class="key" data-number="8">8</button>
            <button class="key" data-number="9">9</button>
            <button class="key operator" data-operator="×">×</button>

            <button class="key" data-number="4">4</button>
            <button class="key" data-number="5">5</button>
            <button class="key" data-number="6">6</button>
            <button class="key operator" data-operator="-">−</button>

            <button class="key" data-number="1">1</button>
            <button class="key" data-number="2">2</button>
            <button class="key" data-number="3">3</button>
            <button class="key operator" data-operator="+">+</button>

            <button class="key utility" data-action="sign">+/−</button>
            <button class="key" data-number="0">0</button>
            <button class="key" data-action="decimal">.</button>
            <button class="key equals" data-action="equals">=</button>

        </section>

        <footer class="calculator-footer">
            <span>Designed for simplicity</span>
            <span>HTML · CSS · JS</span>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
